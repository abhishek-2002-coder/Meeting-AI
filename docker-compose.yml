version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: meetingai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meetingai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetingai_secret}
      POSTGRES_DB: ${POSTGRES_DB:-meetingai_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meetingai} -d ${POSTGRES_DB:-meetingai_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: meetingai-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meetingai-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-meetingai}:${POSTGRES_PASSWORD:-meetingai_secret}@postgres:5432/${POSTGRES_DB:-meetingai_db}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-meetingai}:${POSTGRES_PASSWORD:-meetingai_secret}@postgres:5432/${POSTGRES_DB:-meetingai_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-meetingai_super_secret_jwt_key_32_characters_minimum}
      - STORAGE_DIR=/app/uploads
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - STT_PROVIDER=${STT_PROVIDER:-mock}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://localhost:8000"]
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
